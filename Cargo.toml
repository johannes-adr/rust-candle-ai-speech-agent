[package]
name = "rust-candle-ai-speech-agent"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
# Crane = Candle-basierte Inferenz-Engine (Qwen3-TTS: TTS + Voice Cloning).
# `crane`      -> WAV laden/speichern
# `crane-core` -> das eigentliche Modell
crane = { git = "https://github.com/lucasjinreal/Crane", features = [
    "metal",
    "accelerate",
] }
crane-core = { git = "https://github.com/lucasjinreal/Crane" }

# Async-Runtime + Kanäle zwischen den Pipeline-Stufen.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net"] }
# WebUI-Server (statisches HTML + SSE-Endpunkte).
axum = "0.8"
# OpenAI-kompatibler LLM-Client, konsumiert die SSE-Antwort als Stream.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "rustls-tls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# Audio-Chunks base64-kodiert über SSE an den Browser.
base64 = "0.22"

[profile.release]
opt-level = 3
