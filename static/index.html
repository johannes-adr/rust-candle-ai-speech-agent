<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sprach-Agent</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; padding: 2rem 1rem;
    background: #14161a; color: #e6e6e6;
    font: 15px/1.5 system-ui, sans-serif;
  }
  main { max-width: 42rem; margin: 0 auto; }
  h1 { font-size: 1.25rem; font-weight: 600; margin: 0 0 1.25rem; }
  .tabs { display: flex; gap: .5rem; margin-bottom: 1.25rem; }
  button {
    background: #23272e; color: #e6e6e6;
    border: 1px solid #363b44; border-radius: 6px;
    padding: .5rem .9rem; font: inherit; cursor: pointer;
  }
  button:hover { background: #2b3038; }
  button:disabled { opacity: .5; cursor: default; }
  button.aktiv { background: #3a5bd9; border-color: #3a5bd9; }
  textarea {
    width: 100%; box-sizing: border-box; min-height: 7rem;
    background: #1b1e24; color: #e6e6e6;
    border: 1px solid #363b44; border-radius: 6px;
    padding: .6rem; font: inherit; resize: vertical;
  }
  select, input[type=text] {
    background: #1b1e24; color: #e6e6e6;
    border: 1px solid #363b44; border-radius: 6px;
    padding: .45rem .5rem; font: inherit;
  }
  input[type=text]::placeholder { color: #6b7280; }
  .panel { display: none; }
  .panel.aktiv { display: block; }
  .zeile { display: flex; flex-wrap: wrap; gap: .75rem; margin-top: .75rem; }
  .feld { display: flex; flex-direction: column; gap: .25rem; }
  .feld > span { font-size: .8rem; color: #9aa3b0; }
  /* Checkbox-Reihe für die Chunking-Trennzeichen. */
  .chunkGruppe { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem; }
  .chunkGruppe label {
    display: flex; align-items: center; gap: .4rem;
    background: #1b1e24; border: 1px solid #363b44; border-radius: 6px;
    padding: .3rem .6rem; cursor: pointer;
  }
  .chunkGruppe label:hover { border-color: #4a515c; }
  .chunkGruppe input { accent-color: #3a5bd9; margin: 0; }
  /* Ein „," als Beschriftung wäre winzig — deshalb groß und monospace. */
  .chunkGruppe .zeichen {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 1.15rem; line-height: 1; min-width: .8em; text-align: center;
  }
  /* Alles abgewählt ist die überraschende Einstellung — die fällt so auf.
     Die Selektoren sind bewusst spitz, sonst gewinnen .feld > span bzw.
     .hinweis mit ihrer Standardfarbe. */
  .feld > span.chunkAus, p.hinweis.chunkAus { color: #e0b060; }
  #chunkHinweis { margin-top: .45rem; }
  /* Gleiche Warnfarbe für „Referenz ist unnötig lang". */
  .warnung { color: #e0b060; }
  .klon { margin-top: 1rem; padding-top: .9rem; border-top: 1px solid #2b3038; }
  .klon h2 { font-size: .8rem; text-transform: uppercase; letter-spacing: .06em;
             color: #9aa3b0; margin: 0 0 .35rem; font-weight: 600; }
  /* Felder im Klon-Block stehen untereinander, nicht in einer .zeile. */
  .klon .feld { margin-bottom: .7rem; align-items: flex-start; }
  .klon .feld select, .klon .feld input[type=text] { min-width: 14rem; }
  .hinweis { color: #9aa3b0; font-size: .85rem; margin: 0 0 .7rem; }
  input[type=file] { font: inherit; color: #9aa3b0; display: block; margin-bottom: .7rem; }
  textarea.klein { min-height: 3.5rem; }
  button.klein { padding: .3rem .6rem; font-size: .85rem; }
  /* Dropdown „Gespeicherte Stimme" und der Löschen-Knopf stehen nebeneinander. */
  .stimmeZeile { display: flex; align-items: flex-end; gap: .5rem; margin-bottom: .7rem; }
  .klon .stimmeZeile .feld { margin-bottom: 0; }
  /* Aufnahmeknopf plus laufende Sekundenanzeige. */
  .aufnahmeZeile { display: flex; align-items: center; gap: .6rem; margin: 0 0 .7rem; }
  #referenzQuelle { display: flex; align-items: center; gap: .6rem; }
  #referenzVorschau { display: block; width: 100%; max-width: 22rem; margin-bottom: .7rem; }
  .status { margin: 1rem 0; color: #9aa3b0; min-height: 1.5em; }
  .fehler { color: #ff8080; white-space: pre-wrap; }
  .ausgabe { margin-top: 1.25rem; }
  .ausgabe h2 { font-size: .8rem; text-transform: uppercase; letter-spacing: .06em;
                color: #9aa3b0; margin: 1rem 0 .35rem; font-weight: 600; }
  .box {
    background: #1b1e24; border: 1px solid #2b3038; border-radius: 6px;
    padding: .6rem .7rem; min-height: 1.5em; white-space: pre-wrap;
  }
</style>
</head>
<body>
<main>
  <h1>Sprach-Agent</h1>

  <div id="tabs" class="tabs">
    <button id="tabS2s" class="aktiv">Speech-to-Speech</button>
    <button id="tabTts">Text-to-Speech</button>
  </div>

  <section id="panelS2s" class="panel aktiv">
    <button id="aufnahmeBtn">Aufnehmen</button>
  </section>

  <section id="panelTts" class="panel">
    <textarea id="text" placeholder="Text eingeben …"></textarea>

    <!-- Auswahlfelder bleiben verborgen, bis /api/config sie gefüllt hat. -->
    <div id="optionen" class="zeile" style="display:none">
      <label id="spracheFeld" class="feld">
        <span>Sprache</span>
        <select id="sprache"></select>
      </label>
      <label id="stimmeFeld" class="feld">
        <span>Stimme</span>
        <select id="stimme"></select>
      </label>
    </div>

    <!-- Steuert, an welchen Zeichen der Server den Text vor der Synthese
         zerlegt. Gehört nur hierher: Speech-to-Speech schickt rohes PCM ohne
         JSON-Rahmen und bleibt deshalb bei der Server-Einstellung.
         Die Vorbelegung hier entspricht dem üblichen Server-Default und wird
         von /api/config überschrieben, sobald die da ist. -->
    <div class="zeile">
      <div class="feld">
        <span id="chunkLabel">Chunking (Trennzeichen)</span>
        <div id="chunkGruppe" class="chunkGruppe">
          <label><input type="checkbox" data-zeichen="." checked><span class="zeichen">.</span></label>
          <label><input type="checkbox" data-zeichen=","><span class="zeichen">,</span></label>
          <label><input type="checkbox" data-zeichen="!" checked><span class="zeichen">!</span></label>
          <label><input type="checkbox" data-zeichen="?" checked><span class="zeichen">?</span></label>
        </div>
      </div>
    </div>
    <p id="chunkHinweis" class="hinweis"></p>

    <!-- Nur beim Base-Checkpoint sichtbar (voice_cloning: true). -->
    <div id="klonFeld" class="klon" style="display:none">
      <h2>Voice Cloning</h2>

      <!-- Nur sichtbar, wenn der Server überhaupt gespeicherte Stimmen kennt. -->
      <div id="gespeicherteStimmeFeld" class="stimmeZeile" style="display:none">
        <label class="feld">
          <span>Gespeicherte Stimme</span>
          <select id="gespeicherteStimme"></select>
        </label>
        <!-- Nur bei einer echten gespeicherten Stimme, nie beim Upload-Eintrag. -->
        <button id="stimmeLoeschenBtn" class="klein" style="display:none">Löschen</button>
      </div>

      <!-- Der Upload-Zweig: verborgen, sobald eine gespeicherte Stimme gewählt ist. -->
      <div id="klonUpload">
        <p class="hinweis">~5–15 s saubere Aufnahme, Transkript muss exakt passen.
          Referenz hier direkt aufnehmen oder als WAV-Datei wählen — beides zusammen
          geht nicht, es gilt immer das zuletzt Erzeugte.</p>
        <p class="aufnahmeZeile">
          <button id="referenzAufnahmeBtn">Referenz aufnehmen</button>
          <span id="referenzTimer" class="hinweis" style="display:none; margin:0"></span>
        </p>
        <input id="referenzDatei" type="file" accept=".wav,audio/wav">
        <p id="referenzQuelle" class="hinweis" style="display:none">
          <span id="referenzQuelleText"></span>
          <button id="referenzVerwerfenBtn" class="klein">Verwerfen</button>
        </p>
        <!-- Zum Gegenhören der eigenen Aufnahme (bei Datei-Auswahl verborgen). -->
        <audio id="referenzVorschau" controls style="display:none"></audio>
        <textarea id="referenzText" class="klein" placeholder="Transkript der Referenz-Aufnahme …"></textarea>
        <label class="feld" style="margin-top:.7rem">
          <span>Speichern unter (optional)</span>
          <input id="speichernAls" type="text" placeholder="z. B. johannes">
        </label>
      </div>
    </div>

    <p><button id="sprechenBtn">Sprechen</button></p>
  </section>

  <p id="status" class="status"></p>
  <p id="fehler" class="fehler"></p>

  <!-- Erscheint, sobald der erste Audio-Chunk eines Durchlaufs da ist. -->
  <p id="downloadZeile" style="display:none"><button id="downloadBtn">Audio herunterladen</button></p>

  <div id="ausgabe" class="ausgabe">
    <h2>Du</h2>
    <div id="transkript" class="box"></div>
    <h2>Antwort</h2>
    <div id="antwort" class="box"></div>
  </div>
</main>

<script>
// ── Elemente ────────────────────────────────────────────────────────────────
const el = (id) => document.getElementById(id);
const statusEl = el('status'), fehlerEl = el('fehler');
const transkriptEl = el('transkript'), antwortEl = el('antwort');
const aufnahmeBtn = el('aufnahmeBtn'), sprechenBtn = el('sprechenBtn');

const setStatus = (t) => { statusEl.textContent = t; };
const setFehler = (t) => { fehlerEl.textContent = t; };

// ── Serverfähigkeiten ───────────────────────────────────────────────────────
// Vorbelegt mit den Annahmen des Vollbetriebs; /api/config korrigiert sie
// gleich beim Start (siehe unten).
let zielRate = 16000;
let kannS2s = true, hatSprachen = false, hatStimmen = false, kannKlonen = false;

// ── Modus-Umschaltung ───────────────────────────────────────────────────────
function modus(s2s) {
  el('tabS2s').classList.toggle('aktiv', s2s);
  el('tabTts').classList.toggle('aktiv', !s2s);
  el('panelS2s').classList.toggle('aktiv', s2s);
  el('panelTts').classList.toggle('aktiv', !s2s);
}
// Ohne STT/LLM gibt es den Modus nicht — der Tab ist dann ohnehin ausgeblendet,
// der Guard hält das Umschalten auch per Tastatur zuverlässig zu.
el('tabS2s').onclick = () => { if (kannS2s) modus(true); };
el('tabTts').onclick = () => modus(false);

// ── Sichtbarkeit ────────────────────────────────────────────────────────────
// '' setzt auf den Wert aus dem Stylesheet zurück (bei .panel also wieder auf
// die .aktiv-Steuerung), 'none' überschreibt ihn.
const zeigen = (element, an) => { element.style.display = an ? '' : 'none'; };

// ── Abspielwarteschlange ────────────────────────────────────────────────────
// Die Pipeline liefert Satz für Satz Audio. Statt auf alles zu warten, landet
// jeder Chunk in einer Queue; es läuft immer nur EIN Audio-Element, und dessen
// 'ended' startet den nächsten Chunk — dadurch lückenlose Wiedergabe.
const queue = [];
let spieltGerade = false;
const player = new Audio();
player.addEventListener('ended', naechsterChunk);
player.addEventListener('error', naechsterChunk); // defekter Chunk blockiert nicht

function naechsterChunk() {
  if (player.src) URL.revokeObjectURL(player.src);
  const blob = queue.shift();
  if (!blob) { spieltGerade = false; player.removeAttribute('src'); return; }
  spieltGerade = true;
  player.src = URL.createObjectURL(blob);
  // Scheitert das Abspielen (typischerweise die Autoplay-Sperre), sonst still
  // die ganze Antwort verschluckt würde — deshalb sichtbar melden.
  player.play().catch((e) => {
    setFehler('Wiedergabe blockiert (' + e.name + ') — einmal auf die Seite klicken.');
    naechsterChunk();
  });
}

function audioEinreihen(base64) {
  const roh = atob(base64);
  const bytes = new Uint8Array(roh.length);
  for (let i = 0; i < roh.length; i++) bytes[i] = roh.charCodeAt(i);
  mitschneiden(bytes); // zusätzlich zur Wiedergabe, ändert an der Queue nichts
  queue.push(new Blob([bytes], { type: 'audio/wav' }));
  if (!spieltGerade) naechsterChunk();
}

// ── Mitschnitt für den Download ─────────────────────────────────────────────
// Der Server schickt pro Satz eine eigenständige WAV-Datei mit eigenem Header.
// Einfach aneinandergehängt ergäbe das keine gültige Datei — also sammeln wir
// nur die reinen PCM-Blöcke und setzen beim Klick EINEN frischen Header davor.
let pcmTeile = [];    // je Chunk ein Uint8Array mit reinem PCM
let pcmFormat = null; // Rate/Kanäle/Bits, übernommen vom ersten Chunk
let downloadUrl = null;

function mitschnittZuruecksetzen() {
  pcmTeile = [];
  pcmFormat = null;
  zeigen(el('downloadZeile'), false);
}

// Läuft die RIFF-Chunkliste ab Byte 12 ab (je 4 Byte ID + 4 Byte Länge,
// little-endian). Feste 44 Byte Header anzunehmen wäre falsch, sobald vor
// 'data' noch etwas anderes steht (z. B. ein LIST-Chunk).
function wavZerlegen(bytes) {
  if (bytes.length < 12) return null;
  const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  const kennung = (p) =>
    String.fromCharCode(bytes[p], bytes[p + 1], bytes[p + 2], bytes[p + 3]);
  if (kennung(0) !== 'RIFF' || kennung(8) !== 'WAVE') return null;

  let format = null, daten = null;
  let pos = 12;
  while (pos + 8 <= bytes.length) {
    const id = kennung(pos);
    const laenge = view.getUint32(pos + 4, true);
    const inhalt = pos + 8;
    if (id === 'fmt ' && laenge >= 16) {
      format = {
        kanaele: view.getUint16(inhalt + 2, true),
        rate: view.getUint32(inhalt + 4, true),
        bits: view.getUint16(inhalt + 14, true),
      };
    } else if (id === 'data') {
      // Längenfeld 0 (Streaming-Header) oder überlang: auf den Rest begrenzen.
      const ende = Math.min(inhalt + (laenge || bytes.length - inhalt), bytes.length);
      daten = bytes.subarray(inhalt, ende);
    }
    pos = inhalt + laenge + (laenge % 2); // Chunks liegen auf geraden Grenzen
  }
  return format && daten ? { format, daten } : null;
}

function mitschneiden(bytes) {
  const teil = wavZerlegen(bytes);
  // Unlesbarer Chunk: die Wiedergabe läuft weiter, er fehlt nur im Download.
  if (!teil) return;
  if (!pcmFormat) pcmFormat = teil.format;
  pcmTeile.push(teil.daten);
  zeigen(el('downloadZeile'), true);
}

// Kanonischer 44-Byte-Header (RIFF/WAVE, fmt PCM 16, data).
function wavKopf(laenge, format) {
  const kopf = new Uint8Array(44);
  const view = new DataView(kopf.buffer);
  const text = (p, s) => { for (let i = 0; i < s.length; i++) kopf[p + i] = s.charCodeAt(i); };
  const bytesProRahmen = format.kanaele * (format.bits / 8);
  text(0, 'RIFF');
  view.setUint32(4, 36 + laenge, true); // alles ab Byte 8
  text(8, 'WAVE');
  text(12, 'fmt ');
  view.setUint32(16, 16, true);         // Länge des fmt-Blocks
  view.setUint16(20, 1, true);          // 1 = PCM, unkomprimiert
  view.setUint16(22, format.kanaele, true);
  view.setUint32(24, format.rate, true);
  view.setUint32(28, format.rate * bytesProRahmen, true); // Bytes pro Sekunde
  view.setUint16(32, bytesProRahmen, true);
  view.setUint16(34, format.bits, true);
  text(36, 'data');
  view.setUint32(40, laenge, true);
  return kopf;
}

// 2026-08-02T14-31-05 — Doppelpunkte mögen Dateisysteme nicht.
function zeitstempel() {
  const d = new Date();
  const zwei = (n) => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + zwei(d.getMonth() + 1) + '-' + zwei(d.getDate()) +
         'T' + zwei(d.getHours()) + '-' + zwei(d.getMinutes()) + '-' + zwei(d.getSeconds());
}

el('downloadBtn').onclick = () => {
  if (!pcmTeile.length || !pcmFormat) return;
  const laenge = pcmTeile.reduce((n, t) => n + t.length, 0);
  const blob = new Blob([wavKopf(laenge, pcmFormat), ...pcmTeile], { type: 'audio/wav' });

  if (downloadUrl) URL.revokeObjectURL(downloadUrl);
  downloadUrl = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = downloadUrl;
  a.download = 'sprachagent-' + zeitstempel() + '.wav';
  a.click();
  // Freigeben, sobald der Browser den Download übernommen hat.
  setTimeout(() => {
    if (downloadUrl) { URL.revokeObjectURL(downloadUrl); downloadUrl = null; }
  }, 60000);
};

// ── SSE-Antwort eines fetch()-POST lesen ────────────────────────────────────
// fetch() kennt keinen EventSource, also selbst puffern und an \n\n splitten.
async function sseLesen(response) {
  if (!response.ok) {
    // 400/409 liefern eine Klartext-Begründung im Body — die ist deutlich
    // nützlicher als die nackte Statuszeile. Erst lesen, dann werfen.
    const meldung = await response.text().catch(() => '');
    throw new Error(meldung.trim() || 'Server: HTTP ' + response.status);
  }
  const reader = response.body.getReader();
  const decoder = new TextDecoder();
  let puffer = '';

  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    puffer += decoder.decode(value, { stream: true });

    let grenze;
    while ((grenze = puffer.indexOf('\n\n')) !== -1) {
      const block = puffer.slice(0, grenze);
      puffer = puffer.slice(grenze + 2); // Rest bleibt gepuffert (Teilblock)
      for (const zeile of block.split('\n')) {
        if (!zeile.startsWith('data:')) continue;
        try { ereignis(JSON.parse(zeile.slice(5).trim())); }
        catch (e) { setFehler('Ungültiges Event: ' + e.message); }
      }
    }
  }
}

// Ein Fehler im Stream kommt mit HTTP 200 an; für „hat der Durchlauf geklappt?"
// (Stimme gespeichert?) braucht es deshalb diesen Merker.
let sseFehler = false;

function ereignis(ev) {
  if (ev.type === 'transcript') transkriptEl.textContent = ev.text;
  else if (ev.type === 'delta') antwortEl.textContent += ev.text;
  else if (ev.type === 'audio') audioEinreihen(ev.wav);
  else if (ev.type === 'error') { sseFehler = true; setFehler('Fehler: ' + ev.message); }
  else if (ev.type === 'done') setStatus('Fertig');
}

// ── Referenz-Aufnahme einlesen (Voice Cloning) ──────────────────────────────
// btoa() will einen String, also müssen die Bytes erst einer werden.
// String.fromCharCode(...bytes) auf einen Schlag sprengt bei einer WAV-Datei
// von einigen hundert Kilobyte den Argument-Stack — deshalb blockweise.
function base64Von(buffer) {
  const bytes = new Uint8Array(buffer);
  const BLOCK = 8192;
  let text = '';
  for (let i = 0; i < bytes.length; i += BLOCK) {
    text += String.fromCharCode.apply(null, bytes.subarray(i, i + BLOCK));
  }
  return btoa(text);
}

function dateiAlsBase64(datei) {
  return new Promise((fertig, fehlgeschlagen) => {
    const leser = new FileReader();
    leser.onload = () => fertig(base64Von(leser.result));
    leser.onerror = () => fehlgeschlagen(new Error('Referenz-Datei nicht lesbar.'));
    leser.readAsArrayBuffer(datei);
  });
}

// ── Referenz direkt aufnehmen (Voice Cloning) ───────────────────────────────
// Zweiter Weg neben dem Datei-Upload. Aufgenommen wird mit demselben Rekorder
// wie bei Speech-to-Speech, nur landet das Ergebnis nicht beim Server, sondern
// als fertige WAV in `referenzAufnahme`.
//
// Bewusst OHNE Resampling: die native Rate der Aufnahme (typisch 48000) wandert
// unverändert in den WAV-Header. Der Server bringt die Referenz ohnehin auf die
// Rate, die das Modell braucht — ein zusätzliches Resampling hier wäre nur
// vermeidbarer Qualitätsverlust.
let referenzAufnahme = null;  // { bytes: Uint8Array, dauer: Sekunden }
let referenzUrl = null;       // Blob-URL der Vorschau, wird beim Ersetzen freigegeben
let referenzLaeuft = false, referenzTicker = null, referenzStart = 0;

// „8,2 s" — Dezimalkomma, wie im Deutschen üblich.
const sekunden = (n) => n.toFixed(1).replace('.', ',') + ' s';

// Float32 [-1,1] → 16-bit-PCM mono, mit dem kanonischen Header davor.
function wavAusSamples(samples, rate) {
  const pcm = new Uint8Array(samples.length * 2);
  const view = new DataView(pcm.buffer);
  for (let i = 0; i < samples.length; i++) {
    // Clampen: alles außerhalb [-1,1] würde beim Skalieren überlaufen.
    const wert = Math.max(-1, Math.min(1, samples[i]));
    view.setInt16(i * 2, Math.round(wert * 32767), true);
  }
  const kopf = wavKopf(pcm.length, { kanaele: 1, rate, bits: 16 });
  const datei = new Uint8Array(kopf.length + pcm.length);
  datei.set(kopf, 0);
  datei.set(pcm, kopf.length);
  return datei;
}

// Nur die Aufnahme (samt Vorschau) wegwerfen — die Datei-Auswahl bleibt.
function aufnahmeWegwerfen() {
  referenzAufnahme = null;
  if (referenzUrl) { URL.revokeObjectURL(referenzUrl); referenzUrl = null; }
  el('referenzVorschau').removeAttribute('src');
}

// Aufnahme und Datei sind Alternativen — es gilt immer die zuletzt entstandene.
// Diese Anzeige sagt, welche das gerade ist.
function referenzAnzeigeAktualisieren() {
  const datei = el('referenzDatei').files[0];
  const feld = el('referenzQuelleText');
  if (referenzAufnahme) {
    feld.textContent = 'Verwendet: Aufnahme (' + sekunden(referenzAufnahme.dauer) + ')';
    // Länger als ~15 s macht den Klon nicht besser, kostet aber spürbar Zeit:
    // Voice Cloning kann nicht streamen, und der Speaker-Encoder rechnet die
    // ganze Referenz durch (gemessen: 5 s → 6,5 s, 30 s → 23 s bis zum Ton).
    const langsam = referenzAufnahme.dauer > 15;
    if (langsam) feld.textContent += ' — länger als nötig, das bremst nur';
    feld.classList.toggle('warnung', langsam);
  } else if (datei) {
    feld.textContent = 'Verwendet: ' + datei.name;
    feld.classList.remove('warnung');
  }
  zeigen(el('referenzQuelle'), !!(referenzAufnahme || datei));
  zeigen(el('referenzVorschau'), !!referenzAufnahme);
}

// „Verwerfen" stellt auf gar keine Referenz zurück.
el('referenzVerwerfenBtn').onclick = () => {
  aufnahmeWegwerfen();
  el('referenzDatei').value = '';
  referenzAnzeigeAktualisieren();
};

el('referenzDatei').onchange = () => {
  // Eine frisch gewählte Datei schlägt eine vorhandene Aufnahme.
  if (el('referenzDatei').files[0]) aufnahmeWegwerfen();
  referenzAnzeigeAktualisieren();
};

el('referenzAufnahmeBtn').onclick = () =>
  (referenzLaeuft ? referenzStoppen() : referenzStarten());

async function referenzStarten() {
  setFehler('');
  try {
    await rekorderStarten();
  } catch (e) {
    setFehler('Kein Mikrofonzugriff: ' + e.message);
    return;
  }
  referenzLaeuft = true;
  referenzStart = Date.now();
  el('referenzAufnahmeBtn').textContent = 'Aufnahme stoppen';
  // Während der Aufnahme gibt es nichts zu sprechen — die Referenz ist ja
  // noch gar nicht fertig.
  sprechenBtn.disabled = true;
  zeigen(el('referenzTimer'), true);
  const tick = () => {
    el('referenzTimer').textContent =
      'Aufnahme läuft … ' + sekunden((Date.now() - referenzStart) / 1000);
  };
  tick();
  referenzTicker = setInterval(tick, 100);
}

async function referenzStoppen() {
  referenzLaeuft = false;
  clearInterval(referenzTicker); referenzTicker = null;
  zeigen(el('referenzTimer'), false);
  el('referenzAufnahmeBtn').textContent = 'Referenz aufnehmen';
  el('referenzAufnahmeBtn').disabled = true;
  try {
    const { samples, rate } = await rekorderStoppen();
    if (samples.length === 0) { setFehler('Nichts aufgenommen.'); return; }
    aufnahmeWegwerfen(); // gibt eine ältere Vorschau-URL frei
    referenzAufnahme = {
      bytes: wavAusSamples(samples, rate),
      dauer: samples.length / rate,
    };
    // Die frische Aufnahme schlägt eine zuvor gewählte Datei.
    el('referenzDatei').value = '';
    referenzUrl = URL.createObjectURL(
      new Blob([referenzAufnahme.bytes], { type: 'audio/wav' }));
    el('referenzVorschau').src = referenzUrl;
    referenzAnzeigeAktualisieren();
  } catch (e) {
    setFehler('Aufnahme fehlgeschlagen: ' + e.message);
  } finally {
    el('referenzAufnahmeBtn').disabled = false;
    sprechenBtn.disabled = false;
  }
}

// ── Chunking (Trennzeichen) ─────────────────────────────────────────────────
// Der Server zerlegt den Text vor der Synthese an diesen Zeichen und schickt
// jeden Satz sofort als eigenen Audio-Chunk. Mehr Trennzeichen heißt: früher
// Ton, aber zerhacktere Betonung, weil das Modell kürzere Bruchstücke einzeln
// vertont. Kein Trennzeichen heißt: alles am Stück.
const chunkKaesten = () =>
  Array.from(document.querySelectorAll('#chunkGruppe input'));

// Genau die angehakten Zeichen, in der Reihenfolge der Kästchen.
// Leerer String = Chunking aus.
const chunkAt = () =>
  chunkKaesten().filter((k) => k.checked).map((k) => k.dataset.zeichen).join('');

function chunkAnzeigeAktualisieren() {
  const aus = chunkAt() === '';
  el('chunkLabel').textContent = 'Chunking (Trennzeichen)' + (aus ? ' — aus' : '');
  el('chunkLabel').classList.toggle('chunkAus', aus);
  el('chunkHinweis').classList.toggle('chunkAus', aus);
  el('chunkHinweis').textContent = aus
    ? 'Kein Trennzeichen angehakt: der Text wird am Stück vertont — beste '
      + 'Betonung, aber der Ton kommt erst, wenn der komplette Text fertig '
      + 'gerechnet ist.'
    : 'Mehr Trennzeichen = früher Ton, aber zerhacktere Betonung, weil das '
      + 'Modell die kürzeren Bruchstücke einzeln vertont. Nichts angehakt = '
      + 'alles am Stück.';
}

for (const kasten of chunkKaesten()) kasten.onchange = chunkAnzeigeAktualisieren;
chunkAnzeigeAktualisieren();

// ── Text-to-Speech ──────────────────────────────────────────────────────────
sprechenBtn.onclick = async () => {
  const text = el('text').value.trim();
  if (!text) return;
  transkriptEl.textContent = ''; antwortEl.textContent = ''; setFehler('');
  mitschnittZuruecksetzen();
  sseFehler = false;
  sprechenBtn.disabled = true;
  setStatus('Denke nach …');
  try {
    // Nicht gesetzte Felder bleiben weg — der Server nimmt dann seinen Default.
    const anfrage = { text };
    if (hatSprachen && el('sprache').value) anfrage.language = el('sprache').value;
    if (hatStimmen && el('stimme').value) anfrage.speaker = el('stimme').value;
    // Anders als oben IMMER mitschicken, auch als leerer String: nur so ist
    // „alle Trennzeichen abgewählt" (Chunking aus) davon unterscheidbar, dass
    // das Feld fehlt (Server-Default).
    anfrage.chunk_at = chunkAt();

    // Nach erfolgreichem Durchlauf neu zu ladender Stimmenname, sonst null.
    let gespeichertAls = null;

    if (kannKlonen) {
      const gewaehlt = el('gespeicherteStimme').value;
      if (gewaehlt) {
        // Gespeicherte Stimme: schließt eine frische Referenz aus, deshalb
        // wandert hier ausschließlich `voice` in die Anfrage.
        anfrage.voice = gewaehlt;
      } else {
        const datei = el('referenzDatei').files[0];
        // Referenz kommt entweder aus der Direktaufnahme oder aus der Datei —
        // beides gleichzeitig gibt es nicht, die Aufnahme hat Vorrang.
        const hatReferenz = !!(referenzAufnahme || datei);
        const referenzText = el('referenzText').value.trim();
        const name = el('speichernAls').value.trim();
        // Halbe Angaben würde der Server mit 400 ablehnen; das hier sofort zu
        // sagen erspart den Umweg. Gar keine Angabe ist dagegen in Ordnung.
        if ((hatReferenz ? 1 : 0) + (referenzText ? 1 : 0) === 1) {
          setFehler('Voice Cloning braucht beides: Referenz-Aufnahme und Transkript.');
          setStatus('');
          return;
        }
        // „Speichern unter" legt genau die frische Referenz ab — ohne sie gibt
        // es nichts zu speichern.
        if (name && !hatReferenz) {
          setFehler('„Speichern unter" braucht eine Referenz-Aufnahme samt Transkript.');
          setStatus('');
          return;
        }
        // Derselbe Zeichensatz, den der Server erzwingt (sonst HTTP 400).
        if (name && !/^[A-Za-z0-9_-]+$/.test(name)) {
          setFehler('Ungültiger Name: erlaubt sind nur Buchstaben, Ziffern, - und _.');
          setStatus('');
          return;
        }
        if (hatReferenz) {
          anfrage.reference_wav = referenzAufnahme
            ? base64Von(referenzAufnahme.bytes)
            : await dateiAlsBase64(datei);
          anfrage.reference_text = referenzText;
          if (name) { anfrage.save_as = name; gespeichertAls = name; }
        }
      }
    }

    const res = await fetch('/api/tts', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(anfrage),
    });
    await sseLesen(res);
    // Erst wenn der Durchlauf sauber war, ist die Stimme auch wirklich abgelegt.
    if (gespeichertAls && !sseFehler) await gespeicherteStimmenNeuLaden(gespeichertAls);
  } catch (e) {
    setFehler('Fehler: ' + e.message); setStatus('');
  } finally {
    sprechenBtn.disabled = false;
  }
};

// ── Konfiguration vom Server ────────────────────────────────────────────────
// Der Server hat genau EIN TTS-Checkpoint geladen, und das legt fest, was geht:
// entweder Preset-Stimmen (voices gefüllt) oder Voice Cloning (voices leer,
// voice_cloning: true) — nie beides. Dazu kommt, ob überhaupt STT und LLM da
// sind. Alles, was nicht geht, wird hier ausgeblendet statt deaktiviert.
function auswahlFuellen(select, werte, wunsch) {
  select.innerHTML = '';
  for (const wert of werte) {
    const option = document.createElement('option');
    option.value = wert;
    option.textContent = wert;
    select.appendChild(option);
  }
  if (werte.length) select.value = werte.includes(wunsch) ? wunsch : werte[0];
}

// ── Gespeicherte Klon-Stimmen ───────────────────────────────────────────────
// Erster Eintrag mit leerem value = Upload-Zweig; jeder andere Wert ist der
// Name einer serverseitig abgelegten Referenz.
function gespeicherteStimmenFuellen(namen, wunsch) {
  const select = el('gespeicherteStimme');
  select.innerHTML = '';
  const neu = document.createElement('option');
  neu.value = '';
  neu.textContent = 'Neue Aufnahme hochladen …';
  select.appendChild(neu);
  for (const name of namen) {
    const option = document.createElement('option');
    option.value = name;
    option.textContent = name;
    select.appendChild(option);
  }
  select.value = namen.includes(wunsch) ? wunsch : '';
  // Ohne gespeicherte Stimmen gibt es nichts zu wählen — dann bleibt nur Upload.
  zeigen(el('gespeicherteStimmeFeld'), namen.length > 0);
  klonZweigAktualisieren();
}

// Gespeicherte Stimme gewählt → Upload-Felder weg (und umgekehrt).
function klonZweigAktualisieren() {
  const gewaehlt = el('gespeicherteStimme').value;
  zeigen(el('klonUpload'), !gewaehlt);
  // Beim Eintrag „Neue Aufnahme hochladen …" gibt es nichts zu löschen.
  zeigen(el('stimmeLoeschenBtn'), !!gewaehlt);
}
el('gespeicherteStimme').onchange = klonZweigAktualisieren;

// Löschen ist endgültig — deshalb vorher nachfragen, mit Namen im Text.
el('stimmeLoeschenBtn').onclick = async () => {
  const name = el('gespeicherteStimme').value;
  if (!name) return;
  if (!confirm('Stimme „' + name + '" wirklich löschen? ' +
               'Das lässt sich nicht rückgängig machen.')) return;
  setFehler('');
  el('stimmeLoeschenBtn').disabled = true;
  try {
    const res = await fetch('/api/voices/' + encodeURIComponent(name),
                            { method: 'DELETE' });
    if (!res.ok) {
      // 400/404 begründen im Klartext-Body, was schiefging — das ist deutlich
      // nützlicher als die nackte Statuszeile.
      const meldung = await res.text().catch(() => '');
      throw new Error(meldung.trim() || 'HTTP ' + res.status);
    }
    // Die Antwort ist bereits die aktualisierte Liste — kein zweiter GET nötig.
    const namen = await res.json();
    // Ohne Wunsch fällt die Auswahl zurück auf „Neue Aufnahme hochladen …",
    // womit auch der Upload-Zweig wieder auftaucht.
    gespeicherteStimmenFuellen(Array.isArray(namen) ? namen : [], null);
    setStatus('Stimme „' + name + '" gelöscht.');
  } catch (e) {
    setFehler('Löschen fehlgeschlagen: ' + e.message);
  } finally {
    el('stimmeLoeschenBtn').disabled = false;
  }
};

// Nach dem Speichern die Liste frisch holen — dafür reicht /api/voices, die
// ganze Konfiguration muss dafür nicht noch einmal über die Leitung.
async function gespeicherteStimmenNeuLaden(auswahl) {
  try {
    const res = await fetch('/api/voices');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const namen = await res.json();
    gespeicherteStimmenFuellen(Array.isArray(namen) ? namen : [], auswahl);
    // Der Name ist verbraucht; sonst würde der nächste Durchlauf ihn erneut
    // schicken und am doppelten Namen scheitern.
    el('speichernAls').value = '';
  } catch (e) {
    setFehler('Gespeicherte Stimmen nicht ladbar: ' + e.message);
  }
}

function konfigAnwenden(cfg) {
  const sprachen = Array.isArray(cfg.languages) ? cfg.languages : [];
  const stimmen = Array.isArray(cfg.voices) ? cfg.voices : [];

  kannS2s = cfg.speech_to_speech === true;
  hatSprachen = sprachen.length > 0;
  hatStimmen = stimmen.length > 0;
  kannKlonen = cfg.voice_cloning === true;
  if (cfg.sample_rate) zielRate = cfg.sample_rate;

  // Vorbelegung der Trennzeichen: angehakt ist, was serverseitig eingestellt
  // ist. Leerer String heißt entsprechend „alle aus". Fehlt das Feld ganz,
  // bleibt die Vorbelegung aus dem Markup stehen.
  if (typeof cfg.chunk_at === 'string') {
    for (const kasten of chunkKaesten()) {
      kasten.checked = cfg.chunk_at.includes(kasten.dataset.zeichen);
    }
    chunkAnzeigeAktualisieren();
  }

  auswahlFuellen(el('sprache'), sprachen, 'german');
  auswahlFuellen(el('stimme'), stimmen, null);
  gespeicherteStimmenFuellen(
    Array.isArray(cfg.saved_voices) ? cfg.saved_voices : [], null);
  zeigen(el('spracheFeld'), hatSprachen);
  zeigen(el('stimmeFeld'), hatStimmen);
  zeigen(el('optionen'), hatSprachen || hatStimmen);
  zeigen(el('klonFeld'), kannKlonen);

  if (!kannS2s) {
    zeigen(el('tabS2s'), false);
    zeigen(el('panelS2s'), false);
    // Bei nur einem Modus hat die Tab-Leiste keinen Zweck mehr.
    zeigen(el('tabs'), false);
    // Ebenso „Du"/„Antwort": im reinen TTS-Modus gibt es weder ein Transkript
    // noch eine LLM-Antwort.
    zeigen(el('ausgabe'), false);
    modus(false);
  }
}

fetch('/api/config')
  .then((r) => r.json())
  .then(konfigAnwenden)
  .catch((e) => setFehler('Konfiguration nicht ladbar: ' + e.message));

// ── Rekorder (gemeinsam) ────────────────────────────────────────────────────
// Nimmt roh vom Mikrofon auf und gibt das Signal unverändert zurück. Was danach
// damit passiert — resampeln und an /api/s2s schicken oder als WAV-Referenz
// behalten —, entscheidet allein der Aufrufer.
let stream = null, audioCtx = null, node = null, quelle = null;
let bloecke = [];

async function rekorderStarten() {
  stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  audioCtx = new AudioContext();
  quelle = audioCtx.createMediaStreamSource(stream);
  // ScriptProcessor ist deprecated, läuft aber überall und ist hier deutlich
  // kürzer als ein AudioWorklet — wir brauchen nur rohe Float32-Blöcke.
  node = audioCtx.createScriptProcessor(4096, 1, 1);
  bloecke = [];
  node.onaudioprocess = (e) => {
    // Kopieren: der Puffer wird vom Browser wiederverwendet.
    bloecke.push(new Float32Array(e.inputBuffer.getChannelData(0)));
  };
  quelle.connect(node);
  node.connect(audioCtx.destination); // ohne Ziel feuert onaudioprocess nicht
}

// Liefert { samples, rate }: die Blöcke zu einem durchgehenden Signal
// zusammengefügt, dazu die Rate, mit der tatsächlich aufgezeichnet wurde.
async function rekorderStoppen() {
  node.disconnect(); quelle.disconnect();
  stream.getTracks().forEach((t) => t.stop());
  const rate = audioCtx.sampleRate;
  await audioCtx.close();
  stream = null; audioCtx = null; node = null; quelle = null;

  const gesamt = bloecke.reduce((n, b) => n + b.length, 0);
  const samples = new Float32Array(gesamt);
  let pos = 0;
  for (const b of bloecke) { samples.set(b, pos); pos += b.length; }
  bloecke = [];
  return { samples, rate };
}

// ── Aufnahme (Speech-to-Speech) ─────────────────────────────────────────────
let laeuft = false;

aufnahmeBtn.onclick = () => (laeuft ? stoppen() : starten());

async function starten() {
  transkriptEl.textContent = ''; antwortEl.textContent = ''; setFehler('');
  mitschnittZuruecksetzen();
  sseFehler = false;
  try {
    await rekorderStarten();
  } catch (e) {
    setFehler('Kein Mikrofonzugriff: ' + e.message);
    return;
  }
  laeuft = true;
  aufnahmeBtn.textContent = 'Stopp';
  setStatus('Aufnahme läuft');
}

async function stoppen() {
  laeuft = false;
  aufnahmeBtn.textContent = 'Aufnehmen';
  aufnahmeBtn.disabled = true;

  const { samples, rate } = await rekorderStoppen();
  // Hier — anders als bei der Referenz — auf die Rate aus /api/config bringen,
  // die die Pipeline erwartet.
  const pcm = resample(samples, rate, zielRate);
  if (pcm.length === 0) {
    setFehler('Nichts aufgenommen.'); setStatus(''); aufnahmeBtn.disabled = false;
    return;
  }
  setStatus('Denke nach …');
  try {
    const res = await fetch('/api/s2s', {
      method: 'POST',
      headers: { 'Content-Type': 'application/octet-stream' },
      body: pcm.buffer, // rohes little-endian f32, mono
    });
    await sseLesen(res);
  } catch (e) {
    setFehler('Fehler: ' + e.message); setStatus('');
  } finally {
    aufnahmeBtn.disabled = false;
  }
}

// Lineare Interpolation zwischen den beiden Nachbar-Samples — für Sprache
// völlig ausreichend und ohne Filter-Aufwand.
function resample(input, von, nach) {
  if (von === nach || input.length === 0) return input;
  const verhaeltnis = von / nach;
  const laenge = Math.floor(input.length / verhaeltnis);
  const out = new Float32Array(laenge);
  for (let i = 0; i < laenge; i++) {
    const p = i * verhaeltnis;
    const i0 = Math.floor(p);
    const i1 = Math.min(i0 + 1, input.length - 1);
    const t = p - i0;
    out[i] = input[i0] * (1 - t) + input[i1] * t;
  }
  return out;
}
